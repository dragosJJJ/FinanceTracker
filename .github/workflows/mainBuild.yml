name: CI Build

on:
  pull_request:
    branches:
      - main  

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'  
          
      - name: Restore .NET dependencies
        run: dotnet restore --ignore-failed-sources

      - name: Create solution filter
        run: |
          $content = @"
          {
            "solution": {
              "path": "FinanceTracker.sln",
              "projects": [
                "src\\FinanceTracker.API\\FinanceTracker.API.csproj",
                "src\\FinanceTracker.Application\\FinanceTracker.Application.csproj",
                "src\\FinanceTracker.Domain\\FinanceTracker.Domain.csproj",
                "src\\FinanceTracker.Infrastructure\\FinanceTracker.Infrastructure.csproj"
              ]
            }
          }
          "@
          $content | Out-File -FilePath backend.slnf -Encoding utf8
      - name: Build .NET project
        # run: dotnet build --configuration Release --no-restore /p:BuildProjectReferences=false /p:SkipInvalidConfigurations=true /p:ExcludeProjects="*FinanceTracker.Client*"
        # run: dotnet build --configuration Release ./src/FinanceTracker.API/FinanceTracker.API.csproj ./src/FinanceTracker.Application/FinanceTracker.Application.csproj ./src/FinanceTracker.Domain/FinanceTracker.Domain.csproj ./src/FinanceTracker.Infrastructure/FinanceTracker.Infrastructure.csproj
        run: dotnet build backend.slnf --configuration Release --no-restore
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Angular dependencies
        run: npm install
        working-directory: src/FinanceTracker.Client
          
      - name: Build Angular
        run: npm run build --if-present
        working-directory: src/FinanceTracker.Client
